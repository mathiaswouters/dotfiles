# Link manifest: the single source of truth for "what gets linked where".
#
# Both consumers read this file, so neither can drift from the other:
#   - scripts/setup.sh  (any OS: macOS, Fedora, Arch, Debian/Ubuntu, WSL)
#   - the `dotfiles` Ansible role in the heimora repo (Fedora Sway)
#
# Format: three whitespace-separated columns.
#
#   scope   source (relative to repo root)   destination (relative to $HOME)
#
# Scopes:
#   common     Linked everywhere.
#   wayland    Wayland/Sway session only. Skipped on macOS and WSL.
#   ghostty    Linked only when Ghostty is the chosen terminal.
#   alacritty  Linked only when Alacritty is the chosen terminal.
#
# A source may be a file or a directory; a directory is linked as a whole.
# Destination parent directories are created automatically.
# Lines starting with # and blank lines are ignored. Paths may not contain spaces.

common      zsh/.zshrc                  .zshrc
common      starship/starship.toml      .config/starship/starship.toml
common      lf/lfrc                     .config/lf/lfrc
common      nvim                        .config/nvim
common      tmux                        .config/tmux

wayland     sway                        .config/sway
wayland     waybar                      .config/waybar
wayland     mako                        .config/mako

ghostty     ghostty/config              .config/ghostty/config
alacritty   alacritty/alacritty.toml    .config/alacritty/alacritty.toml
